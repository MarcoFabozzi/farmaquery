name: Archivia rami storici (una tantum)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/archivia-rami-storici.yml'

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: farmaquery-archiviazione-rami
  cancel-in-progress: false

jobs:
  archivia:
    if: github.repository == 'MarcoFabozzi/farmaquery'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Conserva i commit in tag prima di rimuovere i vecchi rami
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from urllib.error import HTTPError
          from urllib.parse import quote
          from urllib.request import Request, urlopen

          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          archive = "archivio/rami-20261125/"
          root = f"https://api.github.com/repos/{repo}"
          out = {"repository": repo, "archivio_tag": archive, "archiviati": [], "preservati": [], "errori": []}

          def api(method, path, obj=None):
              payload = None if obj is None else json.dumps(obj).encode("utf-8")
              req = Request(
                  root + path, data=payload, method=method,
                  headers={
                      "Authorization": "Bearer " + token,
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "FarmaQuery-branch-archive",
                      **({"Content-Type": "application/json"} if payload is not None else {}),
                  }
              )
              with urlopen(req, timeout=40) as resp:
                  body = resp.read()
                  return json.loads(body) if body else None

          def items(endpoint):
              collected = []
              page = 1
              while True:
                  part = api("GET", f"{endpoint}{'&' if '?' in endpoint else '?'}per_page=100&page={page}")
                  collected.extend(part)
                  if len(part) < 100:
                      break
                  page += 1
              return collected

          def ref_path(kind, name):
              return "/git/ref/" + kind + "/" + quote(name, safe="/")

          branches = items("/branches")
          active_prs = items("/pulls?state=open")
          active = {
              pr["head"]["ref"]
              for pr in active_prs
              if pr.get("head", {}).get("repo")
              and pr["head"]["repo"]["full_name"] == repo
          }
          if not 1 <= len(branches) <= 250:
              raise RuntimeError("Numero inatteso di rami; blocco preventivo")

          for branch in branches:
              name = branch["name"]
              sha = branch["commit"]["sha"]
              if name == "main" or branch.get("protected") or name in active:
                  out["preservati"].append({"nome": name, "sha": sha, "motivo": "main/protetto/PR aperta"})
                  continue
              tag = archive + name
              try:
                  # Controllo anti-race: nessuna cancellazione se il ramo è cambiato.
                  live = api("GET", ref_path("heads", name))
                  if live["object"]["sha"] != sha:
                      out["preservati"].append({"nome": name, "motivo": "SHA cambiato"})
                      continue

                  try:
                      existing = api("GET", ref_path("tags", tag))
                  except HTTPError as e:
                      if e.code != 404:
                          raise
                      existing = None
                  if existing is None:
                      api("POST", "/git/refs", {"ref": "refs/tags/" + tag, "sha": sha})
                  verified = api("GET", ref_path("tags", tag))
                  if verified["object"]["sha"] != sha:
                      raise RuntimeError("Tag archivio con SHA differente")

                  live = api("GET", ref_path("heads", name))
                  if live["object"]["sha"] != sha:
                      out["preservati"].append({"nome": name, "motivo": "ramo aggiornato prima della cancellazione"})
                      continue

                  api("DELETE", "/git/refs/heads/" + quote(name, safe="/"))
                  out["archiviati"].append({"nome": name, "sha": sha, "tag": tag})
                  print("ARCHIVIATO:", name, sha)
              except Exception as exc:
                  out["errori"].append({"nome": name, "sha": sha, "errore": str(exc)})
                  print("NON CANCELLATO:", name, str(exc))

          Path("archivio_rami_esito.json").write_text(
              json.dumps(out, ensure_ascii=False, indent=2), encoding="utf-8"
          )
          print("RIEPILOGO:", "archiviati=", len(out["archiviati"]),
                "preservati=", len(out["preservati"]), "errori=", len(out["errori"]))
          if out["errori"]:
              raise SystemExit(1)
          PY

      - name: Conserva il rapporto della pulizia
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: archivio-rami-storici-20261125
          path: archivio_rami_esito.json
          if-no-files-found: warn
          retention-days: 90
