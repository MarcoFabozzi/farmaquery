name: FarmaQuery - note regionali Campania e centri AIFA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'regione_campania_etl.py'
      - 'regione_campania_dashboard.py'
      - '.github/workflows/aggiorna-regione-campania.yml'
  schedule:
    # Aggiornamento giornaliero e controlli successivi in caso di fonte non disponibile.
    - cron: '17 2,8,14,20 * * *'

permissions:
  contents: write

concurrency:
  group: farmaquery-single-snapshot-writer
  cancel-in-progress: false

jobs:
  aggiorna-regione:
    if: github.repository == 'MarcoFabozzi/farmaquery'
    runs-on: ubuntu-latest
    timeout-minutes: 140
    steps:
      - uses: actions/checkout@v4
      - name: Sincronizza main prima di elaborare
        run: |
          git fetch origin main
          git checkout -B main origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dipendenze di estrazione PDF e OCR italiano
        run: |
          python -m pip install --disable-pip-version-check 'PyMuPDF>=1.24,<2'
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-ita tesseract-ocr-eng
      - name: Test dei parser e del database regionale
        run: |
          python -m py_compile regione_campania_etl.py regione_campania_dashboard.py dashboard_regolatorio.py
          python -m unittest -v tests.test_regione_campania
      - name: Importa archivi Campania e strutture AIFA
        run: |
          python regione_campania_etl.py
      - name: Pubblica soltanto snapshot verificati
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add risultati/regione_campania.sqlite.gz risultati/stato_fonti/regione_campania.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: aggiorna note Campania e strutture AIFA'
            for attempt in 1 2 3; do
              if git pull --rebase origin main && git push origin HEAD:main; then
                exit 0
              fi
              git rebase --abort || true
              sleep 5
            done
            echo 'Pubblicazione regionale fallita, snapshot remoto non modificato.'
            exit 1
          fi
