name: Tesi - collaudo finale chatbot su SQLite statico

on:
  push:
    branches: [main]
    paths:
      - 'tesi/collaudo_finale.py'
      - '.github/workflows/tesi-collaudo-finale.yml'
  workflow_dispatch:
    inputs:
      max_domande:
        description: 'Quante domande inviare ai due motori'
        type: choice
        options: ['1','2','4']
        default: '2'
      modello:
        description: 'Stesso modello per entrambe le tecniche'
        type: string
        default: 'gemini/gemini-3.5-flash-lite'

permissions:
  contents: read
  actions: read

jobs:
  collaudo:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Carica la copia GU verificata se il repo è ancora in fase di rilascio
        uses: actions/download-artifact@v4
        with:
          name: tesi-database-statico-revisionato
          run-id: 41636077969
          github-token: ${{ github.token }}
          path: risultati
      - name: Installa dipendenze del chatbot e operatori LOTUS
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          python -m pip check
      - name: Verifica riferimenti e tabelle senza chiamare modelli
        run: |
          mkdir -p dist_tesi
          python -m tesi.collaudo_finale --out dist_tesi/collaudo_offline.json
      - name: Interroga veramente Text-to-SQL e TAG se Gemini è configurato
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MODEL: ${{ inputs.modello || 'gemini/gemini-3.5-flash-lite' }}
          N: ${{ inputs.max_domande || '2' }}
        run: |
          python -m tesi.collaudo_finale --live --model "$MODEL" \
            --max-domande "$N" --out dist_tesi/collaudo_live.json
      - name: Pubblica i risultati grezzi e i controlli
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: farmaquery-collaudo-finale
          path: |
            dist_tesi/collaudo_offline.json
            dist_tesi/collaudo_live.json
          if-no-files-found: warn
          retention-days: 90
