name: FarmaQuery - AIFA legacy solo manuale

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: farmaquery-single-snapshot-writer
  cancel-in-progress: false

jobs:
  refresh:
    if: github.repository == 'MarcoFabozzi/farmaquery'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Decide whether source is due or retry is needed
        id: due
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          from datetime import datetime,time,timedelta,timezone
          now=datetime.now(timezone.utc)
          cutoff=datetime.combine(now.date(),time(5,0),tzinfo=timezone.utc)
          if now<cutoff:cutoff-=timedelta(days=1)
          path=Path('risultati/stato_fonti/aifa.json')
          try:
              info=json.loads(path.read_text(encoding='utf-8'))
              timestamp=datetime.fromisoformat(info['ultimo_successo_utc'].replace('Z','+00:00'))
              if timestamp.tzinfo is None or info.get('esito')!='OK':timestamp=None
          except (OSError,ValueError,KeyError,TypeError):
              timestamp=None
          due=os.environ.get('EVENT_NAME')=='workflow_dispatch' or timestamp is None or timestamp<cutoff
          print('Fonte: aifa | ultimo successo:',timestamp,'| tentativo:',due)
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write('run='+str(due).lower()+'\n')
          PY

      - name: Check Python source files
        if: steps.due.outputs.run == 'true'
        run: python -m py_compile farmaquery/pipeline.py scripts/aggiorna_automatico.py scripts/aggiorna_indipendente.py farmaquery/gazzetta_incrementale.py

      - name: Update AIFA and validate snapshot
        if: steps.due.outputs.run == 'true'
        run: python -m scripts.aggiorna_indipendente --source aifa

      - name: Publish AIFA on success
        if: steps.due.outputs.run == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add risultati/farmaci_automatico.sqlite risultati/stato_fonti/aifa.json
          if [ 'aifa' = 'gazzetta' ]; then
            git add risultati/gazzetta_testi/
          fi
          if ! git diff --cached --quiet; then
            git commit -m 'data: aifa fonte aggiornata e validata'
            # Prima integra i commit intervenuti su main (senza forzare i dati).
            for attempt in 1 2 3; do
              if git -c rebase.autoStash=true pull --rebase origin main && git push origin HEAD:main; then
                break
              fi
              git rebase --abort || true
              if [ "$attempt" -eq 3 ]; then
                echo "Conflitto o aggiornamenti concorrenti: nessun force-push. Riprovare dopo una nuova elaborazione." >&2
                exit 1
              fi
              sleep 5
            done
          fi

      - name: Source already up to date today
        if: steps.due.outputs.run == 'false'
        run: echo 'Fonte aifa verificata nella finestra giornaliera; nessun download necessario.'
