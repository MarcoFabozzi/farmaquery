name: Crea snapshot online per la tesi

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tesi/prepara_snapshot_online.py'
      - 'tesi/benchmark_revisione_relatori_30_candidati.csv'
      - 'tesi/pilota_4_tipi_relatori_da_validare.csv'
      - '.github/workflows/crea-snapshot-tesi-online.yml'

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Crea SQLite sperimentale dal commit corrente e manifesta fonti
        run: |
          mkdir -p dist_tesi
          python -m tesi.prepara_snapshot_online \
            --output dist_tesi/esperimento_online.sqlite \
            --manifest dist_tesi/manifest_fonti_online.json
      - name: Congela le 30 domande candidate e le 8 domande pilota
        run: |
          cp tesi/benchmark_revisione_relatori_30_candidati.csv dist_tesi/benchmark_30_da_validare.csv
          cp tesi/pilota_4_tipi_relatori_da_validare.csv dist_tesi/pilota_4_tipi_da_validare.csv
          cp tesi/PROTOCOLLO_REVISIONE_RELATORE.md dist_tesi/PROTOCOLLO_REVISIONE_RELATORE.md
          python - <<'PY'
          import csv
          from pathlib import Path
          for name, expected in [('benchmark_30_da_validare.csv', 30),
                                  ('pilota_4_tipi_da_validare.csv', 8)]:
              with (Path('dist_tesi') / name).open(encoding='utf-8-sig', newline='') as stream:
                  data=list(csv.DictReader(stream, delimiter=';'))
              assert len(data)==expected, (name, len(data))
              assert len(set(row['id'] for row in data))==expected, name
              assert all(row['stato_validazione']=='DA_VERIFICARE'
                         and not row['risposta_gold'] for row in data), name
              print(name, len(data), 'domande candidate non ancora validate')
          PY

      - name: Controlla file e hash
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          folder=Path('dist_tesi')
          doc=json.loads((folder/'manifest_fonti_online.json').read_text())
          file=folder/'esperimento_online.sqlite'
          assert file.is_file()
          assert hashlib.sha256(file.read_bytes()).hexdigest()==doc['sha256_sqlite']
          print('A/H:',doc['fonti_ufficiali']['classi_ah']['data_riferimento'])
          print('Git commit:',doc['git_commit'])
          print('SHA-256 SQLite:',doc['sha256_sqlite'])
          print('Conteggi:',doc['conteggi'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: tesi-snapshot-fonti-online
          path: dist_tesi/
          if-no-files-found: error
          retention-days: 30
