name: Pubblica la fotografia statica della tesi

on:
  pull_request:
    paths:
      - 'tesi/riproduci_statico_v2.py'
      - '.github/workflows/tesi-fissa-snapshot.yml'
      - 'chatbot_farmaquery.py'
  push:
    branches: [main]
    paths:
      - 'tesi/riproduci_statico_v2.py'
      - '.github/workflows/tesi-fissa-snapshot.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  ricostruisci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recupera ESCLUSIVAMENTE lo snapshot originale 02-11-2026
        uses: actions/download-artifact@v4
        with:
          name: tesi-snapshot-fonti-online
          run-id: 41436480339
          repository: MarcoFabozzi/farmaquery
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: _fotografia_originale
      - name: Ricostruisci e valida lo snapshot statico della tesi
        run: |
          python tesi/riproduci_statico_v2.py \
            --original _fotografia_originale/esperimento_online.sqlite \
            --manifest-originale _fotografia_originale/manifest_fonti_online.json \
            --db _fotografia_output/tesi_statico_v2.sqlite \
            --manifest risultati/tesi_statico_v2.json \
            --gzip risultati/tesi_statico_v2.sqlite.gz
          python - <<'PY'
          import gzip,hashlib,json,sqlite3
          m=json.load(open('risultati/tesi_statico_v2.json'))
          h=hashlib.sha256()
          with gzip.open('risultati/tesi_statico_v2.sqlite.gz','rb') as f:
              while b:=f.read(1048576):h.update(b)
          assert h.hexdigest()==m['sha256_sqlite']
          with sqlite3.connect('_fotografia_output/tesi_statico_v2.sqlite') as d:
              assert d.execute("pragma integrity_check").fetchone()[0]=='ok'
              assert d.execute("select count(*) from nota_centro_documentato").fetchone()[0]==28
              assert d.execute("select count(*) from revisione_relazioni_manuale_v2").fetchone()[0]==28
              assert d.execute("select count(*) from nota_rimando_revisionato").fetchone()[0]==2
              assert d.execute("select count(*) from note").fetchone()[0]==380
          print('Fotografia e relazioni manuali verificati')
          PY
      - name: Pubblica archivio della tesi come artifact controllabile
        uses: actions/upload-artifact@v4
        with:
          name: farmaquery-statico-v2
          path: |
            risultati/tesi_statico_v2.sqlite.gz
            risultati/tesi_statico_v2.json
          retention-days: 90
      - name: Fissa la fotografia compressa nel repository per Streamlit
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add risultati/tesi_statico_v2.sqlite.gz risultati/tesi_statico_v2.json
          if git diff --cached --quiet; then
            echo "Fotografia gia presente, nessun aggiornamento."
          else
            git commit -m "Tesi: snapshot statico 02-11-2026 riproducibile [skip ci]"
            git push origin HEAD:main
          fi
