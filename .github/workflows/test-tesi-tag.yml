name: Test protocollo sperimentale TAG vs Text-to-SQL

on:
  pull_request:
    paths:
      - 'tesi/**'
      - '.github/workflows/test-tesi-tag.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'sqlglot>=25'
      - name: Compila pilota e verifica SQL sola lettura e FTS
        run: |
          python -m py_compile tesi/pilota_tag_vs_sql.py
          python -m unittest discover -s tesi/tests -p 'test_*.py' -v
