name: Verifica chatbot Text-to-SQL e LOTUS

on:
  pull_request:
    paths:
      - 'chatbot_farmaquery.py'
      - 'chatbot_widget.py'
      - 'errori_chatbot.py'
      - 'tesi/pilota_tag_vs_sql.py'
      - 'tesi/tests/test_recupero_tag.py'
      - 'tests/test_errori_chatbot.py'
      - 'tests/test_assistente_flottante.py'
      - 'pages/**'
      - 'requirements.txt'
      - 'dashboard_regolatorio.py'
      - 'tests/test_chatbot_farmaquery.py'
      - '.github/workflows/test-chatbot.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installazione delle stesse dipendenze del sito
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          python -m pip check
      - name: Compila app e verifica i moduli reali
        run: |
          python -m py_compile dashboard_regolatorio.py chatbot_widget.py chatbot_farmaquery.py errori_chatbot.py tesi/pilota_tag_vs_sql.py
          python -m unittest discover -s tests -p 'test_assistente_flottante.py' -v
          python -m unittest discover -s tests -p 'test_chatbot_farmaquery.py' -v
          python -m unittest discover -s tests -p 'test_errori_chatbot.py' -v
          python -m unittest discover -s tesi/tests -p 'test_recupero_tag.py' -v
          python - <<'PY'
          import streamlit
          import lotus
          import litellm
          import sqlglot
          print('I quattro componenti del chatbot sono disponibili.')
          PY
      - name: Simula la creazione del DB condiviso senza LLM
        run: |
          python - <<'PY'
          import chatbot_farmaquery as c
          from tesi import pilota_tag_vs_sql as m
          version=c.snapshot_version()
          path,meta=c.prepare_snapshot()
          assert path.exists()
          assert meta['conteggi']['note']>100
          assert meta['conteggi']['aifa_confezioni']>100000
          assert meta['conteggi']['ema_medicinali']>1000
          with m.read_only(path) as db:
            candidate=m.evidence_candidates(db,'Qual è la classe di JIVI?')
            assert any(r['tipo']=='AIFA' for r in candidate),candidate
            # Controlla il recupero sul VERO archivio AIFA, non solo
            # su esempi sintetici: non associare Tachipirina a Saridon.
            tach=m.evidence_candidates(db,'Qual è il principio attivo di Tachipirina?')
            aifa=[r for r in tach if r['tipo']=='AIFA']
            assert aifa and all('Medicinale: TACHIPIRINA;' in r['testo'] for r in aifa),aifa
            assert all('PARACETAMOLO' in r['testo'].upper() for r in aifa)
            para=m.evidence_candidates(db,'Che principio attivo ha paracetamolo?')
            assert para and not any(
                'ANTIREUMINA' in r['testo'] or 'SARIDON' in r['testo']
                for r in para),para
            question=('PLUVICTO: per quale tumore è indicato, quale classe '
                      'ha in Italia e dove è prevista la somministrazione in Campania?')
            plu=m.evidence_candidates(db,question,max_rows=10)
            types={r['tipo'] for r in plu}
            print('PLUVICTO: fonti presenti nel vero DB:',sorted(types),
                  'righe per tipo:',{t:sum(x['tipo']==t for x in plu)
                                   for t in sorted(types)})
            assert 'EMA' in types and 'AIFA' in types,plu
            verified=m._multisource_evidence(plu,[],question)
            assert {'EMA','AIFA'}.issubset({x['tipo'] for x in verified})
            if 'REGIONE' not in types:
                print('Avviso: nessuna nota regionale nominativa recuperata; '
                      'il chatbot dovrà dichiarare la parte non documentata.')
          print('Recupero mirato e copertura multifonte verificati su AIFA/EMA reali.')
          PY
