name: Diagnostica classi AIFA C/Cnn

on:
  pull_request:
    paths:
      - 'diagnostica_classi.py'
      - '.github/workflows/diagnostica-classi.yml'

permissions:
  contents: read

jobs:
  diagnostica:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Diagnostica dati AIFA nello snapshot
        run: python diagnostica_classi.py
