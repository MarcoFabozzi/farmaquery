name: Tesi - costruisci e distribuisci base statica 02-11-2026

on:
  pull_request:
    paths:
      - 'tesi/build_frozen_demo.py'
      - 'chatbot_farmaquery.py'
      - 'tests/test_chatbot_farmaquery.py'
      - 'tesi/collaudo_statico.py'
      - 'tesi/demo_finale_quattro_domande.csv'
      - '.github/workflows/tesi-deploy-statico.yml'
  push:
    branches: [main]
    paths:
      - 'tesi/build_frozen_demo.py'
      - '.github/workflows/tesi-deploy-statico.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build_static:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Scarica lo stesso snapshot originale congelato
        uses: actions/download-artifact@v4
        with:
          name: tesi-snapshot-fonti-online
          run-id: 41436480339
          github-token: ${{ github.token }}
          path: frozen_source
      - name: Recupera i documenti GU dalla STESSA versione sorgente
        uses: actions/checkout@v4
        with:
          ref: 630613a1b3e5353fe33e207e843fb8dad5591b2a
          path: frozen_gu
          persist-credentials: false
      - name: Prepara SQLite statico e manifesta SHA-256
        run: |
          python -m tesi.build_frozen_demo \
            --db frozen_source/esperimento_online.sqlite \
            --manifest frozen_source/manifest_fonti_online.json \
            --gu-root frozen_gu \
            --output risultati/tesi_statico_20261102.sqlite.gz \
            --output-manifest risultati/tesi_statico_20261102.json
      - name: Verifica archivio, hash e tabelle statiche
        run: |
          python - <<'PY'
          from hashlib import sha256
          import gzip,json,sqlite3,tempfile
          from pathlib import Path
          archive=Path('risultati/tesi_statico_20261102.sqlite.gz')
          manifest=json.loads(Path('risultati/tesi_statico_20261102.json').read_text())
          with tempfile.TemporaryDirectory() as folder:
              dbfile=Path(folder)/'tesi.sqlite'
              with gzip.open(archive,'rb') as source,dbfile.open('wb') as target:
                  while part:=source.read(1<<20): target.write(part)
              assert sha256(dbfile.read_bytes()).hexdigest()==manifest['sha256_sqlite']
              with sqlite3.connect(dbfile) as db:
                  assert db.execute('PRAGMA integrity_check').fetchone()[0]=='ok'
                  for tab,num in (('note',380),('pagine',942),('nota_centro_documentato',28)):
                      assert db.execute('SELECT COUNT(*) FROM '+tab).fetchone()[0]==num
                  assert db.execute("SELECT COUNT(*) FROM gu_atti").fetchone()[0]>0
                  assert db.execute("SELECT COUNT(*) FROM gu_segmenti").fetchone()[0]>0
                  print('Snapshot statico con GU verificato:',manifest['sha256_sqlite'])
          PY
      - name: Precollaudo documentale con le quattro tipologie del relatore
        run: |
          python - <<'PY'
          import gzip,shutil
          with gzip.open('risultati/tesi_statico_20261102.sqlite.gz','rb') as src,open('frozen_source/tesi_demo.sqlite','wb') as dst:
              shutil.copyfileobj(src,dst)
          PY
          python tesi/collaudo_statico.py \
            --db frozen_source/tesi_demo.sqlite \
            --manifest risultati/tesi_statico_20261102.json \
            --out frozen_source/collaudo_quattro_casi.json
      - name: Archivia il database per il confronto locale
        uses: actions/upload-artifact@v4
        with:
          name: tesi-database-statico-revisionato
          path: |
            risultati/tesi_statico_20261102.sqlite.gz
            risultati/tesi_statico_20261102.json
            frozen_source/collaudo_quattro_casi.json
          retention-days: 90
          if-no-files-found: error
      - name: Distribuisci i due file statici nel repository
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add risultati/tesi_statico_20261102.sqlite.gz risultati/tesi_statico_20261102.json
          if git diff --cached --quiet; then
            echo "La fotografia statica è già distribuita."
          else
            git commit -m "tesi: distribuisce SQLite statico del 02-11-2026 [skip ci]"
            git push origin HEAD:main
          fi
      - name: Interroga TAG e Text-to-SQL sullo stesso SQLite congelato
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && vars.FARMAQUERY_RUN_LIVE_DEMO == 'true')
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FARMAQUERY_LLM_MODEL: ${{ vars.FARMAQUERY_LLM_MODEL }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "Gemini non disponibile tra i Secrets delle GitHub Actions."
            echo "LLM_NON_CONFIGURATO" > frozen_source/esito_interrogazioni.txt
          else
            python -m pip install --disable-pip-version-check -r requirements.txt
            python -m tesi.esegui_benchmark \
              --db frozen_source/tesi_demo.sqlite \
              --manifest risultati/tesi_statico_20261102.json \
              --domande tesi/demo_finale_quattro_domande.csv \
              --out frozen_source/risposte_chatbot.csv \
              --model "${FARMAQUERY_LLM_MODEL:-gemini/gemini-2.5-flash}" \
              --max-domande 4 --conferma-chiamate
          fi
      - name: Conserva risposte effettive, senza attribuire punteggi gold
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && vars.FARMAQUERY_RUN_LIVE_DEMO == 'true')
        uses: actions/upload-artifact@v4
        with:
          name: tesi-demo-risposte-dei-due-motori
          path: |
            frozen_source/risposte_chatbot.csv
            frozen_source/esito_interrogazioni.txt
            frozen_source/collaudo_quattro_casi.json
          if-no-files-found: warn
          retention-days: 90
