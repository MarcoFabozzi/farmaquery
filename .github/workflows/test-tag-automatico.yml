name: Test offline TAG automatico

on:
  push:
    branches: [main]
    paths:
      - 'tesi/tag_automatico.py'
      - 'tesi/recupero_progressivo.py'
      - 'tesi/pilota_tag_vs_sql.py'
      - 'tests/test_tag_automatico.py'
      - 'tests/test_recupero_progressivo.py'
      - 'chatbot_farmaquery.py'
      - 'chatbot_widget.py'
      - '.github/workflows/test-tag-automatico.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verifica:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dipendenze per test senza provider LLM
        run: python -m pip install --disable-pip-version-check 'pandas>=2' 'sqlglot>=25'
      - name: Controlla la sintassi dei moduli e del chatbot
        run: |
          python -m py_compile tesi/tag_automatico.py tesi/recupero_progressivo.py tesi/pilota_tag_vs_sql.py chatbot_farmaquery.py chatbot_widget.py
      - name: Testa SQL e recupero pagine senza chiamate API
        run: |
          python -m unittest discover -s tests -p 'test_tag_automatico.py' -v
          python -m unittest discover -s tests -p 'test_recupero_progressivo.py' -v
