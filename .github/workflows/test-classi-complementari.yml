name: Test integrazione classi C e Cnn

on:
  pull_request:
    paths:
      - 'classi_complementari.py'
      - 'aifa_componenti.py'
      - 'aggiorna_indipendente.py'
      - 'dashboard_regolatorio.py'
      - 'tests/test_classi_complementari.py'
      - '.github/workflows/aggiorna-aifa-cnn.yml'
      - '.github/workflows/test-classi-complementari.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compila codice sorgente e dashboard
        run: python -m py_compile pipeline.py classi_aifa.py classi_complementari.py aifa_componenti.py aggiorna_indipendente.py dashboard_regolatorio.py
      - name: Test classi ed acquisizione AIFA
        run: python -m unittest -v tests.test_classi_complementari tests.test_classi_aifa tests.test_aifa_componenti tests.test_aifa_principi_attivi
