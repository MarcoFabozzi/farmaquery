name: Test ETL note regionali

on:
  pull_request:
    paths:
      - 'regione_campania_etl.py'
      - 'regione_campania_dashboard.py'
      - 'dashboard_regolatorio.py'
      - 'tests/test_regione_campania.py'
      - '.github/workflows/aggiorna-regione-campania.yml'
      - '.github/workflows/test-regione-campania.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installa parser PDF
        run: python -m pip install 'PyMuPDF>=1.24,<2'
      - name: Compila codice e verifica PDF, strutture e SQLite
        run: |
          python -m py_compile regione_campania_etl.py regione_campania_dashboard.py dashboard_regolatorio.py
          python -m unittest -v tests.test_regione_campania
